<!-- ===== tsdb-config: a historian database (a folder) ===== -->
<script type="text/javascript">
    RED.nodes.registerType('tsdb-config', {
        category: 'config',
        defaults: {
            name: { value: 'historian', required: true },
            dir: { value: '' },
            rawDays: { value: 30, validate: RED.validators.number() },
            indexDays: { value: 365, validate: RED.validators.number() },
            walFlushMs: { value: 1000, validate: RED.validators.number() },
            checkpointMs: { value: 60000, validate: RED.validators.number() },
            rules: { value: '[]' },
            ram: { value: '[]' }
        },
        label: function () { return this.name || 'historian'; },
        oneditprepare: function () {
            var rules = [], ram = [];
            try { rules = JSON.parse(this.rules || '[]'); } catch (e) { rules = []; }
            try { ram = JSON.parse(this.ram || '[]'); } catch (e) { ram = []; }
            // a flow of an older version keeps a RAM pattern in the disk list with store: "memory": it is shown in the RAM list now
            var older = rules.filter(function (r) { return r.store === 'memory' || r.store === 'ram'; });
            rules = rules.filter(function (r) { return !(r.store === 'memory' || r.store === 'ram'); });
            ram = ram.concat(older);
            var UNIT = { ms: 1, s: 1000, m: 60000, h: 3600000, d: 86400000, w: 604800000, mo: 2592000000, y: 31536000000 };
            function ms(x) { var m = /^\s*(\d+(?:\.\d+)?)\s*(ms|s|m|h|d|w|mo|y)\s*$/.exec(String(x || '')); return m ? Number(m[1]) * UNIT[m[2]] : NaN; }
            function box(sel, isRam) {
                var host = $(sel);
                function addRow(r) {
                    r = r || {};
                    var row = $('<div class="tsdb-rule">').css({ border: '1px solid var(--red-ui-form-input-border-color, #ccc)', 'border-radius': '4px', padding: '6px 8px', 'margin-bottom': '6px' }).appendTo(host);
                    var line = $('<div>').css({ display: 'flex', gap: '6px', 'align-items': 'center', 'flex-wrap': 'wrap' }).appendTo(row);
                    var pat = $('<input type="text" class="tsdb-pattern" placeholder="Tag pattern, e.g. Vib.*">').css({ width: '190px' }).val(r.pattern || '').appendTo(line);
                    $('<span>').text('keep').appendTo(line);
                    var keep = $('<input type="text" class="tsdb-keep">').css({ width: '70px' }).attr('placeholder', isRam ? '10s' : 'for ever').val(r.keep || '').appendTo(line);
                    var raw, max;
                    if (isRam) {
                        $('<span>').text('max points').appendTo(line);
                        max = $('<input type="number" class="tsdb-max" placeholder="1000000">').css({ width: '95px' }).val(r.max || '').appendTo(line);
                    } else {
                        $('<span>').text('raw').appendTo(line);
                        raw = $('<input type="text" class="tsdb-raw" placeholder="30d">').css({ width: '60px' }).val(r.raw || '').appendTo(line);
                    }
                    $('<button type="button" class="red-ui-button red-ui-button-small"><i class="fa fa-trash-o"></i></button>').css({ 'margin-left': 'auto' }).on('click', function () { row.remove(); }).appendTo(line);
                    var note = $('<div class="tsdb-note">').css({ 'font-size': '12px', 'margin-top': '4px' }).appendTo(row);
                    function show() {
                        var k = ms(keep.val()), lines = [];
                        if (isRam) {
                            if (k > 3600000) lines.push('<span style="color:#b45309"><i class="fa fa-exclamation-triangle"></i> A long keep in RAM uses memory: about 16 bytes a point (1 tag at 100 ms for 24 h is about 14 MB; 1 000 such tags 14 GB). For history leave the tag on Disk.</span>');
                        } else if (k < 3600000 || ms(raw.val()) < 3600000) {
                            lines.push('<span style="color:#dc2626"><i class="fa fa-times-circle"></i> Disk keeps at least 1 hour (1h is used). For seconds or minutes use a RAM pattern.</span>');
                        }
                        if (keep.val() && isNaN(k)) lines.push('<span style="color:#dc2626">Not a duration: use 500ms, 10s, 5m, 2h, 7d, 1y</span>');
                        note.html(lines.join('<br>'));
                    }
                    keep.on('input change', show); if (raw) raw.on('input change', show);
                    show();
                }
                return addRow;
            }
            var addRam = box('#tsdb-ram', true), addDisk = box('#tsdb-rules', false);
            ram.forEach(addRam);
            rules.forEach(addDisk);
            $('#tsdb-ram-add').on('click', function () { addRam({ pattern: '', keep: '10s' }); });
            $('#tsdb-rule-add').on('click', function () { addDisk({ pattern: '', keep: '' }); });
        },
        oneditsave: function () {
            function read(sel, isRam) {
                var list = [];
                $(sel + ' .tsdb-rule').each(function () {
                    var row = $(this), r = { pattern: row.find('.tsdb-pattern').val().trim() };
                    if (!r.pattern) return;
                    var keep = row.find('.tsdb-keep').val().trim(), raw = row.find('.tsdb-raw').val(), max = row.find('.tsdb-max').val();
                    if (keep) r.keep = keep;
                    if (!isRam && raw && raw.trim()) r.raw = raw.trim();
                    if (isRam && max) r.max = Number(max);
                    list.push(r);
                });
                return list;
            }
            $('#node-config-input-rules').val(JSON.stringify(read('#tsdb-rules', false)));
            $('#node-config-input-ram').val(JSON.stringify(read('#tsdb-ram', true)));
        }
    });
</script>
<script type="text/html" data-template-name="tsdb-config">
    <div class="form-row"><label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label><input type="text" id="node-config-input-name"></div>
    <div class="form-row"><label for="node-config-input-dir"><i class="fa fa-folder-o"></i> Folder</label><input type="text" id="node-config-input-dir" placeholder="empty: <userDir>/tsdb/<name>"></div>
    <div class="form-row"><label for="node-config-input-rawDays"><i class="fa fa-clock-o"></i> Raw kept</label><input type="number" id="node-config-input-rawDays" style="width:90px"> days</div>
    <div class="form-row"><label for="node-config-input-indexDays"><i class="fa fa-clock-o"></i> Summaries</label><input type="number" id="node-config-input-indexDays" style="width:90px"> days <span style="opacity:.7">(per chunk; hour and day summaries are kept)</span></div>
    <div class="form-row"><label for="node-config-input-walFlushMs"><i class="fa fa-shield"></i> WAL sync</label><input type="number" id="node-config-input-walFlushMs" style="width:90px"> ms <span style="opacity:.7">(the most a power cut loses)</span></div>
    <div class="form-row"><label for="node-config-input-checkpointMs"><i class="fa fa-floppy-o"></i> Checkpoint</label><input type="number" id="node-config-input-checkpointMs" style="width:90px"> ms</div>
    <div class="form-row" style="margin-bottom:4px"><label><i class="fa fa-bolt"></i> Short-term (RAM)</label>
        <span style="opacity:.75">tags that match are read and written in RAM only (<code>*</code> = any text); every other tag is on Disk</span></div>
    <input type="hidden" id="node-config-input-ram">
    <div id="tsdb-ram" style="margin-left:0"></div>
    <div class="form-row"><button type="button" id="tsdb-ram-add" class="red-ui-button red-ui-button-small"><i class="fa fa-plus"></i> RAM pattern</button>
        <span style="opacity:.75;margin-left:8px">Kept only while Node-RED runs; never written to disk. Their disk data, if any, is not touched.</span></div>
    <div class="form-row" style="margin-bottom:4px"><label><i class="fa fa-hdd-o"></i> Disk retention</label>
        <span style="opacity:.75">how long the disk data of a tag pattern is kept; the first match wins, no match = the settings above</span></div>
    <input type="hidden" id="node-config-input-rules">
    <div id="tsdb-rules" style="margin-left:0"></div>
    <div class="form-row"><button type="button" id="tsdb-rule-add" class="red-ui-button red-ui-button-small"><i class="fa fa-plus"></i> retention</button>
        <span style="opacity:.75;margin-left:8px">keep 1 h or more (empty = for ever); raw = how long the raw points stay (summaries outlive them).</span></div>
</script>
<script type="text/html" data-help-name="tsdb-config">
    <p>A historian database: a folder of compressed time series (Gorilla), with summaries per chunk, hour and day so a chart or a report of any range reads about as many records as the answer has rows.</p>
    <h3>Properties</h3>
    <dl class="message-properties">
        <dt>Folder <span class="property-type">string</span></dt><dd>Empty: <code>&lt;userDir&gt;/tsdb/&lt;name&gt;</code>. A relative path is from the user directory.</dd>
        <dt>Raw kept <span class="property-type">days</span></dt><dd>Raw chunks older than this are deleted; their summaries still draw charts and give aggregates.</dd>
        <dt>WAL sync <span class="property-type">ms</span></dt><dd>Points are written to the write-ahead log and fsynced this often.</dd>
        <dt>Short-term (RAM)</dt><dd>Tag patterns (<code>*</code> = any text, the first match wins) whose tags are read and written in RAM instead of on disk: a ring of the last <code>keep</code> (down to seconds, <code>10s</code>), at most <code>max</code> points; never written to disk, <b>lost on a restart or a redeploy of the database node</b>. A long keep uses memory (about 16 bytes a point): the editor warns.
            Every tag no pattern matches is on <b>Disk</b>. Changing the patterns is a redeploy, so a tag that moves from Disk to RAM starts with an <b>empty</b> RAM and its disk data stays untouched (a query answers from RAM only while the tag is a RAM tag); moved back to Disk, writes go on appending to the same disk data (until the retention below or a drop removes it).</dd>
        <dt>Disk retention</dt><dd>Per tag pattern, the first match wins: <code>keep</code> how long a tag's disk data is kept (1 h or more; empty = for ever; a query never returns older), <code>raw</code> how long its raw points are (summaries outlive them). It follows the patterns at every start, also for a tag that is in RAM at the moment.</dd>
    </dl>
</script>

<script type="text/html" data-help-name="tsdb-store">
    <p>Stores points in the historian.</p>
    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>topic <span class="property-type">string</span></dt><dd>The tag, with <code>payload</code> its value (number, boolean or string) and <code>timestamp</code> its time (ms, Date or ISO; default now).</dd>
        <dt>payload <span class="property-type">array</span></dt><dd>Or many points: <code>[{ "tag": "Oven1.Temp", "ts": 1791240000000, "value": 182.4 }]</code>.</dd>
        <dt>payload <span class="property-type">object</span></dt><dd>Or <code>{ "Oven1.Temp": 182.4, "Oven1.Running": true }</code> at <code>msg.timestamp</code> (no topic).</dd>
    </dl>
    <h3>Details</h3>
    <p>A tag's type is set by its first value. A point older than the tag's newest, or of another type, is refused (counted in the status). A nested object is skipped: the core stores ts, tag, value; the asset layer splits objects into tags.</p>

    <div class="form-row tsdb-bucket"><label for="node-input-tz"><i class="fa fa-globe"></i> Time zone</label><input type="text" id="node-input-tz" placeholder="Asia/Jakarta (empty: UTC)"></div>

    <div class="form-row"><label for="node-input-format"><i class="fa fa-table"></i> Output</label>
        <select id="node-input-format"><option value="series">Series per tag { t: [], v: [] }</option><option value="rows">Rows [{ tag, ts, value }]</option></select></div>

<script type="text/html" data-help-name="tsdb-query">
    <p>Reads the historian. The node's settings are the query; <code>msg.query</code> overrides any of them.</p>
    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt class="optional">query <span class="property-type">object</span></dt>
        <dd><code>{ tags, from, to, mode, bucket, offset, tz, weekStart, minBuckets, endExclusive, agg, fill, limit, page, maxPoints, format }</code>, and the options of the aggregates (<code>value</code>, <code>per</code>, <code>method</code>, <code>reset</code>, <code>ignoreZero</code> ...: see the README). A raw answer past <code>limit</code> is an error (never returned cut); <code>page: true</code> returns pages <code>{ t, v, more, next }</code>: ask the next with <code>from: next</code>. Damaged stored data is an error naming its place, never a wrong value. Times: <code>-8h</code>, <code>now-30m</code>, ISO, ms. Durations: <code>500ms 30s 5m 1h 7d</code>. Tags: names, <code>*</code> matches any text.</dd>
        <dt class="optional">topic <span class="property-type">string</span></dt><dd>The tag, when the query has none.</dd>
        <dt class="optional">query <span class="property-type">array</span></dt><dd>A <b>batch</b>: an array of queries in one call (up to 1000). <code>msg.payload</code> is then an array, in the same order, of <code>{ ok: true, result }</code> or <code>{ ok: false, error }</code>: one that fails does not stop the others. They see the same data.</dd>
    </dl>
    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object | array</span></dt>
        <dd>Series: <code>{ "Oven1.Temp": { type, t: [...], v: [...] } }</code> (buckets: <code>t</code> and an array per aggregate). Rows: <code>[{ tag, ts, value }]</code>.</dd>
    </dl>
    <h3>Modes</h3>
    <ul>
        <li><b>Buckets</b>: the aggregates per interval: avg / min / max / sum / count / first / last / range, delta, increase (a counter that resets), integral and twa (kW to kWh), and for states occurrences / entries / duration / changes / counts / durations, and the spread: stddev / variance (sample; <code>population: true</code> for the whole population), median and any percentile <code>p0</code> ... <code>p100</code> (<code>p95</code>, <code>p99.9</code>; from the raw points, so only as far back as they are kept). The bucket is a size (<code>15m</code>, <code>1h</code>, UTC aligned; <code>offset</code> moves the start), a calendar unit of the time zone (<code>day</code>, <code>week</code>, <code>month</code>, <code>quarter</code>, <code>year</code>) or <code>auto</code> (months for 6 months, weeks for a month, days for a week, hours for a day).</li>
        <li><b>Range</b>: the same aggregates over the whole From - To as one row (for example the consumption between two times).</li>
        <li><b>Raw</b>: every point (limit 1 000 000 a tag). <b>Last</b>: the newest value.</li>
    </ul>
</script>

<script type="text/html" data-template-name="tsdb-admin">
    <div class="form-row"><label for="node-input-db"><i class="fa fa-database"></i> Historian</label><input type="text" id="node-input-db"></div>
    <div class="form-row"><label for="node-input-op"><i class="fa fa-wrench"></i> Default op</label>
        <select id="node-input-op"><option value="stats">stats</option><option value="tags">tags</option><option value="verify">verify (checks every chunk and summary)</option><option value="compact">compact</option><option value="backup">backup (to &lt;userDir&gt;/tsdb/backups)</option></select>
        <span style="opacity:.7">(a delete is always sent in msg.payload)</span></div>

<script type="text/html" data-help-name="tsdb-admin">
    <p>Maintains the historian. <code>msg.payload</code> is the request; without one the node's default op runs (a delete never runs by default).</p>
    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd>
            <code>{ "op": "dropTag", "tags": "Test.*" }</code> drops tags (their data, their summaries; the name can be used again).<br>
            <code>{ "op": "deleteRange", "tags": ["Oven*"], "from": "-2h", "to": "-1h" }</code> deletes the points in a range; the hour / day summaries are rebuilt.<br>
            <code>{ "op": "dropAll", "confirm": "DROP ALL" }</code> deletes every tag and point.<br>
            <code>{ "op": "compact" }</code> reclaims the bytes of dropped tags and replaced chunks.<br>
            <code>{ "op": "verify" }</code> reads every chunk (checksum, then its points against its summary) and recomputes the hour / day summaries: <code>{ ok, chunks, points, damagedChunks, problems: [...] }</code>; <code>{ "op": "verify", "repair": true }</code> drops the damaged chunks from the index and rebuilds the summaries (the database answers again, without the damaged part, which is reported).<br>
            <code>{ "op": "backup" }</code> writes the whole database to one file while it runs (default <code>&lt;userDir&gt;/tsdb/backups/&lt;name&gt;-&lt;time&gt;.tsdb.gz</code>; <code>file</code> to choose, relative to <code>&lt;userDir&gt;/tsdb</code>).<br>
            <code>{ "op": "restore", "file": "backups/....tsdb.gz", "confirm": "RESTORE" }</code> replaces the database with a backup: unpacked and verified first, then swapped in; the previous database is kept as <code>&lt;name&gt;.before-restore-&lt;time&gt;</code>.<br>
            <code>{ "op": "tags", "tags": "Line1.*" }</code>, <code>{ "op": "stats" }</code>.
        </dd>
        <dt class="optional">dryRun <span class="property-type">boolean</span></dt><dd>In the request: what it would delete, nothing changed.</dd>
        <dt class="optional">confirm <span class="property-type">number</span></dt><dd>A pattern that is <code>*</code> or matches more than 100 tags runs only with <code>confirm</code> = the number of tags it matches.</dd>
    </dl>
    <h3>Outputs</h3>
    <dl class="message-properties"><dt>payload <span class="property-type">object</span></dt><dd>What was done: <code>{ op, tags, points, chunksRewritten, summariesDropped }</code>, the list, or the stats.</dd></dl>
    <h3>Details</h3>
    <p>A delete is crash safe: its files are written aside, committed with one line in <code>ops.log</code>, then swapped in; a start after a power cut finishes it. A range whose raw points are past retention loses its summaries whole (reported as <code>summariesDropped</code>).</p>
</script>
