<!-- ===== tsdb-config: a historian database (a folder) ===== -->
<script type="text/javascript">
    RED.nodes.registerType('tsdb-config', {
        category: 'config',
        defaults: {
            name: { value: 'historian', required: true },
            dir: { value: '' },
            rawDays: { value: 30, validate: RED.validators.number() },
            indexDays: { value: 365, validate: RED.validators.number() },
            walFlushMs: { value: 1000, validate: RED.validators.number() },
            checkpointMs: { value: 60000, validate: RED.validators.number() },
            rules: { value: '[]' }
        },
        label: function () { return this.name || 'historian'; },
        oneditprepare: function () {
            var rules = [];
            try { rules = JSON.parse(this.rules || '[]'); } catch (e) { rules = []; }
            var UNIT = { ms: 1, s: 1000, m: 60000, h: 3600000, d: 86400000, w: 604800000, mo: 2592000000, y: 31536000000 };
            function ms(x) { var m = /^\s*(\d+(?:\.\d+)?)\s*(ms|s|m|h|d|w|mo|y)\s*$/.exec(String(x || '')); return m ? Number(m[1]) * UNIT[m[2]] : NaN; }
            var box = $('#tsdb-rules');
            function addRow(r) {
                r = r || { pattern: '', store: 'disk', keep: '' };
                var row = $('<div class="tsdb-rule">').css({ border: '1px solid var(--red-ui-form-input-border-color, #ccc)', 'border-radius': '4px', padding: '6px 8px', 'margin-bottom': '6px' }).appendTo(box);
                var line = $('<div>').css({ display: 'flex', gap: '6px', 'align-items': 'center', 'flex-wrap': 'wrap' }).appendTo(row);
                var pat = $('<input type="text" class="tsdb-pattern" placeholder="Tag pattern, e.g. Vib.*">').css({ width: '170px' }).val(r.pattern || '').appendTo(line);
                var store = $('<select class="tsdb-store"><option value="disk">Disk</option><option value="memory">RAM</option></select>').css({ width: '80px' }).val(r.store === 'memory' || r.store === 'ram' ? 'memory' : 'disk').appendTo(line);
                $('<span>').text('keep').appendTo(line);
                var keep = $('<input type="text" class="tsdb-keep">').css({ width: '70px' }).val(r.keep || '').appendTo(line);
                var rawL = $('<span>').text('raw').appendTo(line);
                var raw = $('<input type="text" class="tsdb-raw" placeholder="30d">').css({ width: '60px' }).val(r.raw || '').appendTo(line);
                var maxL = $('<span>').text('max points').appendTo(line);
                var max = $('<input type="number" class="tsdb-max" placeholder="1000000">').css({ width: '95px' }).val(r.max || '').appendTo(line);
                $('<button type="button" class="red-ui-button red-ui-button-small"><i class="fa fa-trash-o"></i></button>').css({ 'margin-left': 'auto' }).on('click', function () { row.remove(); }).appendTo(line);
                var note = $('<div class="tsdb-note">').css({ 'font-size': '12px', 'margin-top': '4px' }).appendTo(row);
                function show() {
                    var ram = store.val() === 'memory', k = ms(keep.val());
                    keep.attr('placeholder', ram ? '10s' : 'for ever');
                    rawL.toggle(!ram); raw.toggle(!ram); maxL.toggle(ram); max.toggle(ram);
                    var lines = [];
                    if (ram) {
                        lines.push('<span style="color:#b45309"><i class="fa fa-exclamation-triangle"></i> RAM: kept only while Node-RED runs - lost on a restart or a redeploy of this database node. Never written to disk (no SSD / SD wear).</span>');
                        if (k > 3600000) lines.push('<span style="color:#b45309"><i class="fa fa-exclamation-triangle"></i> A long keep in RAM uses memory: about 16 bytes a point (1 tag at 100 ms for 24 h is about 14 MB; 1 000 such tags 14 GB). For history use Disk.</span>');
                    } else if (k < 3600000 || ms(raw.val()) < 3600000) {
                        lines.push('<span style="color:#dc2626"><i class="fa fa-times-circle"></i> Disk keeps at least 1 hour (1h is used). For seconds or minutes choose RAM.</span>');
                    }
                    if (keep.val() && isNaN(k)) lines.push('<span style="color:#dc2626">Not a duration: use 500ms, 10s, 5m, 2h, 7d, 1y</span>');
                    note.html(lines.join('<br>'));
                }
                store.on('change', show); keep.on('input change', show); raw.on('input change', show);
                show();
            }
            rules.forEach(addRow);
            $('#tsdb-rule-add').on('click', function () { addRow({ pattern: '', store: 'memory', keep: '10s' }); });
        },
        oneditsave: function () {
            var list = [];
            $('#tsdb-rules .tsdb-rule').each(function () {
                var row = $(this), r = { pattern: row.find('.tsdb-pattern').val().trim(), store: row.find('.tsdb-store').val() };
                if (!r.pattern) return;
                var keep = row.find('.tsdb-keep').val().trim(), raw = row.find('.tsdb-raw').val().trim(), max = row.find('.tsdb-max').val();
                if (keep) r.keep = keep;
                if (r.store === 'disk' && raw) r.raw = raw;
                if (r.store === 'memory' && max) r.max = Number(max);
                list.push(r);
            });
            $('#node-config-input-rules').val(JSON.stringify(list));
        }
    });
</script>
<script type="text/html" data-template-name="tsdb-config">
    <div class="form-row"><label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label><input type="text" id="node-config-input-name"></div>
    <div class="form-row"><label for="node-config-input-dir"><i class="fa fa-folder-o"></i> Folder</label><input type="text" id="node-config-input-dir" placeholder="empty: <userDir>/tsdb/<name>"></div>
    <div class="form-row"><label for="node-config-input-rawDays"><i class="fa fa-clock-o"></i> Raw kept</label><input type="number" id="node-config-input-rawDays" style="width:90px"> days</div>
    <div class="form-row"><label for="node-config-input-indexDays"><i class="fa fa-clock-o"></i> Summaries</label><input type="number" id="node-config-input-indexDays" style="width:90px"> days <span style="opacity:.7">(per chunk; hour and day summaries are kept)</span></div>
    <div class="form-row"><label for="node-config-input-walFlushMs"><i class="fa fa-shield"></i> WAL sync</label><input type="number" id="node-config-input-walFlushMs" style="width:90px"> ms <span style="opacity:.7">(the most a power cut loses)</span></div>
    <div class="form-row"><label for="node-config-input-checkpointMs"><i class="fa fa-floppy-o"></i> Checkpoint</label><input type="number" id="node-config-input-checkpointMs" style="width:90px"> ms</div>
    <div class="form-row" style="margin-bottom:4px"><label><i class="fa fa-list-ol"></i> Storage rules</label>
        <span style="opacity:.75">per tag pattern, the first match wins (<code>*</code> = any text); a tag no rule matches is on Disk</span></div>
    <input type="hidden" id="node-config-input-rules">
    <div id="tsdb-rules" style="margin-left:0"></div>
    <div class="form-row"><button type="button" id="tsdb-rule-add" class="red-ui-button red-ui-button-small"><i class="fa fa-plus"></i> rule</button>
        <span style="opacity:.75;margin-left:8px">Disk: keep 1 h or more (empty = for ever). RAM: any keep, down to seconds.</span></div>
</script>
<script type="text/html" data-help-name="tsdb-config">
    <p>A historian database: a folder of compressed time series (Gorilla), with summaries per chunk, hour and day so a chart or a report of any range reads about as many records as the answer has rows.</p>
    <h3>Properties</h3>
    <dl class="message-properties">
        <dt>Folder <span class="property-type">string</span></dt><dd>Empty: <code>&lt;userDir&gt;/tsdb/&lt;name&gt;</code>. A relative path is from the user directory.</dd>
        <dt>Raw kept <span class="property-type">days</span></dt><dd>Raw chunks older than this are deleted; their summaries still draw charts and give aggregates.</dd>
        <dt>WAL sync <span class="property-type">ms</span></dt><dd>Points are written to the write-ahead log and fsynced this often.</dd>
        <dt>Storage rules</dt><dd>Per tag pattern, the first match wins.
            <b>Disk</b> (default): <code>keep</code> how long a tag's data is kept (1 h or more; empty = for ever; a query never returns older), <code>raw</code> how long its raw points are (summaries outlive them).
            <b>RAM</b>: a ring of the tag's last <code>keep</code>, down to seconds (<code>10s</code>), at most <code>max</code> points; never written to disk, <b>lost on a restart or a redeploy of the database node</b>. A long keep in RAM uses memory (about 16 bytes a point): the editor warns.
            A tag's store is set when it is created.</dd>
    </dl>
</script>

<script type="text/html" data-template-name="tsdb-store">
    <div class="form-row"><label for="node-input-db"><i class="fa fa-database"></i> Historian</label><input type="text" id="node-input-db"></div>
    <div class="form-row"><label for="node-input-prefix"><i class="fa fa-sitemap"></i> Tag prefix</label><input type="text" id="node-input-prefix" placeholder="Plant1.Line1."></div>
    <div class="form-row"><label for="node-input-changesOnly"><i class="fa fa-filter"></i> Changes only</label><input type="checkbox" id="node-input-changesOnly" style="width:auto"></div>

<script type="text/html" data-help-name="tsdb-store">
    <p>Stores points in the historian.</p>
    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>topic <span class="property-type">string</span></dt><dd>The tag, with <code>payload</code> its value (number, boolean or string) and <code>timestamp</code> its time (ms, Date or ISO; default now).</dd>
        <dt>payload <span class="property-type">array</span></dt><dd>Or many points: <code>[{ "tag": "Oven1.Temp", "ts": 1791240000000, "value": 182.4 }]</code>.</dd>
        <dt>payload <span class="property-type">object</span></dt><dd>Or <code>{ "Oven1.Temp": 182.4, "Oven1.Running": true }</code> at <code>msg.timestamp</code> (no topic).</dd>
    </dl>
    <h3>Details</h3>
    <p>A tag's type is set by its first value. A point older than the tag's newest, or of another type, is refused (counted in the status). A nested object is skipped: the core stores ts, tag, value; the asset layer splits objects into tags.</p>
</script>

<!-- ===== tsdb-query ===== -->
<script type="text/javascript">
    RED.nodes.registerType('tsdb-query', {
        category: 'storage',
        color: '#a6bbcf',
        defaults: {
            name: { value: '' },
            db: { value: '', type: 'tsdb-config', required: true },
            tags: { value: '' },
            from: { value: '-1h' },
            to: { value: 'now' },
            mode: { value: 'bucket' },
            bucket: { value: '1h' },
            offset: { value: '' },
            agg: { value: 'avg' },
            fill: { value: 'none' },
            format: { value: 'series' }
        },
        inputs: 1,
        outputs: 1,
        icon: 'db.svg',
        label: function () { return this.name || 'historian query'; },
        paletteLabel: 'tsdb query',
        oneditprepare: function () {
            $('#node-input-agg').typedInput({ types: [{ value: 'agg', multiple: true, options: ['avg', 'min', 'max', 'sum', 'count', 'first', 'last', 'range', 'delta', 'increase', 'integral', 'twa', 'occurrences', 'entries', 'duration', 'changes', 'counts', 'durations'].map(function (a) { return { value: a, label: a }; }) }] });
            function show() {
                var m = $('#node-input-mode').val();
                $('.tsdb-bucket').toggle(m === 'bucket' || m === 'range');
                $('.tsdb-bucket-only').toggle(m === 'bucket');
            }
            $('#node-input-mode').on('change', show);
            show();
        }
    });
</script>
<script type="text/html" data-template-name="tsdb-query">
    <div class="form-row"><label for="node-input-db"><i class="fa fa-database"></i> Historian</label><input type="text" id="node-input-db"></div>
    <div class="form-row"><label for="node-input-tags"><i class="fa fa-tags"></i> Tags</label><input type="text" id="node-input-tags" placeholder="Oven1.Temp, Line1.*.Speed"></div>
    <div class="form-row"><label for="node-input-from"><i class="fa fa-clock-o"></i> From</label><input type="text" id="node-input-from" style="width:120px"> <label for="node-input-to" style="width:auto;margin-left:10px">to</label> <input type="text" id="node-input-to" style="width:120px"></div>
    <div class="form-row"><label for="node-input-mode"><i class="fa fa-line-chart"></i> Mode</label>
        <select id="node-input-mode">
            <option value="bucket">Buckets (aggregates per interval)</option>
            <option value="range">Range (the aggregates over the whole From - To, one row)</option>
            <option value="raw">Raw points</option>
            <option value="last">Last value</option>
        </select></div>
    <div class="form-row tsdb-bucket tsdb-bucket-only"><label for="node-input-bucket"><i class="fa fa-th"></i> Bucket</label><input type="text" id="node-input-bucket" style="width:90px"> <label for="node-input-offset" style="width:auto;margin-left:10px">offset</label> <input type="text" id="node-input-offset" style="width:90px" placeholder="6h"></div>
    <div class="form-row tsdb-bucket"><label for="node-input-agg"><i class="fa fa-calculator"></i> Aggregates</label><input type="text" id="node-input-agg"></div>
    <div class="form-row tsdb-bucket"><label for="node-input-fill"><i class="fa fa-ellipsis-h"></i> Empty</label>
        <select id="node-input-fill"><option value="none">Skipped</option><option value="null">null</option><option value="previous">The previous bucket</option></select></div>
    <div class="form-row"><label for="node-input-format"><i class="fa fa-table"></i> Output</label>
        <select id="node-input-format"><option value="series">Series per tag { t: [], v: [] }</option><option value="rows">Rows [{ tag, ts, value }]</option></select></div>
    <div class="form-row"><label for="node-input-name"><i class="fa fa-tag"></i> Name</label><input type="text" id="node-input-name"></div>
</script>
<script type="text/html" data-help-name="tsdb-query">
    <p>Reads the historian. The node's settings are the query; <code>msg.query</code> overrides any of them.</p>
    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt class="optional">query <span class="property-type">object</span></dt>
        <dd><code>{ tags, from, to, mode, bucket, offset, agg, fill, limit, page, maxPoints, format }</code>, and the options of the aggregates (<code>value</code>, <code>per</code>, <code>method</code>, <code>reset</code>, <code>ignoreZero</code> ...: see the README). A raw answer past <code>limit</code> is an error (never returned cut); <code>page: true</code> returns pages <code>{ t, v, more, next }</code>: ask the next with <code>from: next</code>. Damaged stored data is an error naming its place, never a wrong value. Times: <code>-8h</code>, <code>now-30m</code>, ISO, ms. Durations: <code>500ms 30s 5m 1h 7d</code>. Tags: names, <code>*</code> matches any text.</dd>
        <dt class="optional">topic <span class="property-type">string</span></dt><dd>The tag, when the query has none.</dd>
    </dl>
    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object | array</span></dt>
        <dd>Series: <code>{ "Oven1.Temp": { type, t: [...], v: [...] } }</code> (buckets: <code>t</code> and an array per aggregate). Rows: <code>[{ tag, ts, value }]</code>.</dd>
    </dl>
    <h3>Modes</h3>
    <ul>
        <li><b>Buckets</b>: the aggregates per interval: avg / min / max / sum / count / first / last / range, delta, increase (a counter that resets), integral and twa (kW to kWh), and for states occurrences / entries / duration / changes / counts / durations (offset: a shift starting at 06:00 is <code>6h</code>).</li>
        <li><b>Range</b>: the same aggregates over the whole From - To as one row (for example the consumption between two times).</li>
        <li><b>Raw</b>: every point (limit 1 000 000 a tag). <b>Last</b>: the newest value.</li>
    </ul>
</script>

<script type="text/html" data-template-name="tsdb-admin">
    <div class="form-row"><label for="node-input-db"><i class="fa fa-database"></i> Historian</label><input type="text" id="node-input-db"></div>
    <div class="form-row"><label for="node-input-op"><i class="fa fa-wrench"></i> Default op</label>
        <select id="node-input-op"><option value="stats">stats</option><option value="tags">tags</option><option value="verify">verify (checks every chunk and summary)</option><option value="compact">compact</option></select>
        <span style="opacity:.7">(a delete is always sent in msg.payload)</span></div>

<script type="text/html" data-help-name="tsdb-admin">
    <p>Maintains the historian. <code>msg.payload</code> is the request; without one the node's default op runs (a delete never runs by default).</p>
    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd>
            <code>{ "op": "dropTag", "tags": "Test.*" }</code> drops tags (their data, their summaries; the name can be used again).<br>
            <code>{ "op": "deleteRange", "tags": ["Oven*"], "from": "-2h", "to": "-1h" }</code> deletes the points in a range; the hour / day summaries are rebuilt.<br>
            <code>{ "op": "dropAll", "confirm": "DROP ALL" }</code> deletes every tag and point.<br>
            <code>{ "op": "compact" }</code> reclaims the bytes of dropped tags and replaced chunks.<br>
            <code>{ "op": "verify" }</code> reads every chunk (checksum, then its points against its summary) and recomputes the hour / day summaries: <code>{ ok, chunks, points, damagedChunks, problems: [...] }</code>; <code>{ "op": "verify", "repair": true }</code> drops the damaged chunks from the index and rebuilds the summaries (the database answers again, without the damaged part, which is reported).<br>
            <code>{ "op": "tags", "tags": "Line1.*" }</code>, <code>{ "op": "stats" }</code>.
        </dd>
        <dt class="optional">dryRun <span class="property-type">boolean</span></dt><dd>In the request: what it would delete, nothing changed.</dd>
        <dt class="optional">confirm <span class="property-type">number</span></dt><dd>A pattern that is <code>*</code> or matches more than 100 tags runs only with <code>confirm</code> = the number of tags it matches.</dd>
    </dl>
    <h3>Outputs</h3>
    <dl class="message-properties"><dt>payload <span class="property-type">object</span></dt><dd>What was done: <code>{ op, tags, points, chunksRewritten, summariesDropped }</code>, the list, or the stats.</dd></dl>
    <h3>Details</h3>
    <p>A delete is crash safe: its files are written aside, committed with one line in <code>ops.log</code>, then swapped in; a start after a power cut finishes it. A range whose raw points are past retention loses its summaries whole (reported as <code>summariesDropped</code>).</p>
</script>
